[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-transcribe"
version = "0.3.0"
description = "Self-contained audio transcription CLI using your existing Codex ChatGPT login"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Agree" }
]
keywords = ["codex", "transcription", "audio", "cli", "chatgpt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "av>=17,<18",
  "httpx>=0.27,<1",
  "imageio-ffmpeg>=0.6,<1",
]

[project.urls]
Homepage = "https://github.com/grimich/codex-transcribe"
Issues = "https://github.com/grimich/codex-transcribe/issues"

[project.scripts]
codex-transcribe = "codex_transcribe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

